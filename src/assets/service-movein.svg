<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a8d8"/>
      <stop offset="100%" stop-color="#9870a8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#402060" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- House -->
  <path d="M100 46 L162 94 L148 94 L148 156 L114 156 L114 120 L86 120 L86 156 L52 156 L52 94 L38 94 Z" fill="white" opacity="0.9" filter="url(#shadow)"/>
  <!-- Window -->
